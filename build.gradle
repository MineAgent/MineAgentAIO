plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	// Minecraft 26.1+ ships unobfuscated (official names), so Loom needs no `mappings` dependency.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Only the loader is needed: this mod does not use the Fabric API, and neither does Baritone.
	// Baritone is *not* bundled; it stays an optional, separately installed mod that the `bt`
	// command reaches reflectively (see com.mineagent.aio.baritone.BaritoneBridge).
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

tasks.named('jar') {
	// Reproducible archives.
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

// Minecraft 26.1+ is unobfuscated, so the plain jar is the loadable one. If a Loom version does
// provide a remapJar, name it consistently.
tasks.matching { it.name == 'remapJar' }.configureEach {
	archiveFileName = "mineagentaio-${project.version}.jar"
}
